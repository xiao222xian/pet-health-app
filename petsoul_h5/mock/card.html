<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pet Soul · Bella</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .card-page {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-hero {
      flex: 1;
      min-height: 55vh;
      background: var(--bg-2);
      position: relative;
    }

    .card-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 24px 24px calc(24px + var(--safe-bottom));
      margin-top: -16px;
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      position: relative;
    }

    .card-name {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .card-breed {
      margin-top: 6px;
      font-size: 13px;
      color: var(--ink-3);
    }

    .card-persona {
      margin-top: 4px;
      font-size: 11px;
      color: var(--ink-4);
    }

    .card-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .card-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 10px;
    }

    .card-section-text {
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.5;
    }

    .card-tags {
      margin-top: 16px;
      display: flex;
      gap: 6px;
    }

    .card-actions {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-url {
      margin-top: 16px;
      font-size: 11px;
      color: var(--ink-4);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app card-page">
    <div class="card-hero">
      <img src="https://images.unsplash.com/photo-1619983081563-430f63602796?w=900&q=80" alt="Bella" data-profile="petPhoto">
    </div>
    <div class="card-body">
      <p class="eyebrow">WingPet Card</p>
      <h1 class="card-name" data-profile="petName">Bella</h1>
      <p class="card-breed" data-profile="breed">柯基 · 社交小太陽</p>
      <p class="card-persona">ENFP · 娛樂向</p>
      <div class="card-tags">
        <span class="chip">外向</span>
        <span class="chip">玩瘋</span>
      </div>

      <section class="card-section">
        <p class="card-section-label">WingPet 線索</p>
        <p class="card-section-text" data-profile="ownerClue">Bella 說：我媽週末都在氹仔海濱，想找固定遛狗搭子，不聊感情只聊狗。</p>
      </section>

      <section class="card-section">
        <p class="card-section-label">主人 · 揭晓后</p>
        <p class="card-section-text" data-profile="ownerRevealed">B媽 · 28 · 設計系 · 合頻 87%</p>
      </section>

      <div class="card-actions">
        <a href="discover.html" class="btn-primary" style="text-decoration:none">在 Discover 刷更多</a>
        <a href="me.html" class="btn-ghost" style="text-decoration:none;display:flex">我的名片</a>
      </div>
      <p class="card-url">petsoul.app/c/bella</p>
    </div>
  </div>
  <script src="js/profile.js"></script>
  <script>window.PetSoulProfile.applyToCard(document);</script>
</body>
</html>
