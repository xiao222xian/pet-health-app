<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pet Soul · 灵魂鉴定</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .quiz-app { overflow: hidden; position: relative; }

    .quiz-bar {
      position: absolute;
      top: calc(8px + var(--safe-top));
      left: 20px;
      right: 20px;
      height: 2px;
      background: var(--bg-2);
      border-radius: 1px;
      z-index: 5;
    }

    .quiz-bar-fill {
      height: 100%;
      background: var(--ink);
      border-radius: 1px;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .quiz-top {
      padding: calc(28px + var(--safe-top)) 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .quiz-count {
      font-size: 12px;
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    .quiz-stage {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .quiz-slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 24px 16px;
      opacity: 0;
      transform: translateX(24px);
      pointer-events: none;
      transition: opacity 0.36s cubic-bezier(0.25, 0.8, 0.25, 1),
                  transform 0.36s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .quiz-slide.is-active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .quiz-slide.is-exit {
      opacity: 0;
      transform: translateX(-24px);
    }

    .intro-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-bottom: 32px;
    }

    .intro-title {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-top: 8px;
    }

    .intro-sub {
      margin-top: 12px;
      font-size: 14px;
      color: var(--ink-3);
      line-height: 1.55;
      max-width: 300px;
    }

    .intro-meta {
      margin-top: 28px;
      width: 100%;
      max-width: 280px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .intro-meta-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 14px;
    }

    .intro-meta-row span:last-child {
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .q-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      overflow-y: auto;
    }

    .q-section {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .q-section-hint {
      font-size: 11px;
      color: var(--ink-4);
      margin-bottom: 20px;
    }

    .q-index {
      font-size: 11px;
      color: var(--ink-4);
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }

    .q-text {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.35;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .q-options { list-style: none; }

    .q-opt { border-top: 1px solid var(--line); }
    .q-opt:last-child { border-bottom: 1px solid var(--line); }

    .q-opt button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink-2);
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .q-opt button.is-picked {
      color: var(--ink);
      font-weight: 500;
      background: var(--bg-2);
    }

    .q-opt .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.2s, transform 0.2s;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .q-opt button.is-picked .dot {
      opacity: 1;
      transform: scale(1);
    }

    .quiz-footer {
      padding: 8px 24px calc(16px + var(--safe-bottom));
      flex-shrink: 0;
    }

    .analyze {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .analyze.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .analyze-orbit {
      width: 120px;
      height: 120px;
      position: relative;
      margin-bottom: 28px;
    }

    .analyze-core {
      position: absolute;
      inset: 36px;
      border-radius: 50%;
      background: var(--bg-2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .analyze-core span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-3);
    }

    .analyze-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ink);
      top: 50%;
      left: 50%;
      margin: -5px 0 0 -5px;
      animation: orbit 2.4s linear infinite;
    }

    .analyze-dot:nth-child(2) { animation-delay: -0.8s; opacity: 0.5; width: 8px; height: 8px; margin: -4px 0 0 -4px; }
    .analyze-dot:nth-child(3) { animation-delay: -1.6s; opacity: 0.35; width: 6px; height: 6px; margin: -3px 0 0 -3px; }

    @keyframes orbit {
      from { transform: rotate(0deg) translateX(52px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(52px) rotate(-360deg); }
    }

    .analyze-title {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .analyze-sub {
      margin-top: 8px;
      font-size: 13px;
      color: var(--ink-3);
    }

    .analyze.is-visible .analyze-orbit {
      animation: scaleIn 0.5s var(--ease-spring) both;
    }

    .analyze.is-visible .analyze-title {
      animation: fadeUp 0.5s var(--ease-out) 0.15s both;
    }

    .analyze.is-visible .analyze-sub {
      animation: fadeUp 0.5s var(--ease-out) 0.25s both;
    }

    .analyze-steps {
      margin-top: 20px;
      font-size: 12px;
      color: var(--ink-4);
      min-height: 18px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="app quiz-app">
    <div class="quiz-bar"><div class="quiz-bar-fill" id="barFill"></div></div>

    <header class="quiz-top">
      <span class="eyebrow">靈魂鑑定 · 初階</span>
      <span class="quiz-count" id="countLabel">0 / 16</span>
    </header>

    <main class="quiz-stage" id="stage"></main>

    <footer class="quiz-footer" id="footer">
      <p class="disclaimer">娛樂向 · 約 2 分鐘</p>
    </footer>
  </div>

  <div class="analyze" id="analyze">
    <div class="analyze-orbit">
      <div class="analyze-dot"></div>
      <div class="analyze-dot"></div>
      <div class="analyze-dot"></div>
      <div class="analyze-core is-pulse"><span>SOUL</span></div>
    </div>
    <p class="analyze-title">正在匹配星群</p>
    <p class="analyze-sub">16 維 Paws-onality · 準備入池</p>
    <p class="analyze-steps" id="analyzeSteps">讀取能量 & 社交…</p>
  </div>

  <script src="js/match-engine.js"></script>
  <script src="js/profile.js"></script>
  <script>
    if (!window.PetSoulProfile.requireProfile()) throw new Error('redirect');
  </script>
  <script src="js/questions.js"></script>
  <script>
    const QUESTIONS = window.PETSOUL_QUIZ.flat;
    const TOTAL = QUESTIONS.length;

    const stage = document.getElementById('stage');
    const barFill = document.getElementById('barFill');
    const countLabel = document.getElementById('countLabel');
    const footer = document.getElementById('footer');
    const analyze = document.getElementById('analyze');

    let qIndex = -1; // -1 = intro
    const answers = [];

    function renderIntro() {
      qIndex = -1;
      countLabel.textContent = `0 / ${TOTAL}`;
      barFill.style.width = '0%';
      footer.innerHTML = `
        <button type="button" class="btn-primary" id="startBtn">開始 · 16 題</button>
        <p class="disclaimer" style="margin-top:14px">娛樂向 · 非專業行為評估</p>
      `;
      stage.innerHTML = `
        <section class="quiz-slide is-active" id="slide-intro">
          <div class="intro-center">
            <p class="eyebrow">Paws-onality · 初階</p>
            <h1 class="intro-title">16 個場景<br>讀懂牠的 Soul</h1>
            <p class="intro-sub">Soul 做分級測驗；Petch 看能量與玩風。初階 16 題、約 2 分鐘，測完進星群、入池開刷。</p>
            <div class="intro-meta">
              <div class="intro-meta-row">
                <span style="color:var(--ink-3)">題量</span>
                <span>16 題</span>
              </div>
              <div class="intro-meta-row" style="border-top:1px solid var(--line)">
                <span style="color:var(--ink-3)">維度</span>
                <span>4 組</span>
              </div>
              <div class="intro-meta-row" style="border-top:1px solid var(--line)">
                <span style="color:var(--ink-3)">進階</span>
                <span style="color:var(--ink-3);font-weight:400">日後可選 +16</span>
              </div>
            </div>
          </div>
        </section>
      `;
      document.getElementById('startBtn').addEventListener('click', () => {
        qIndex = 0;
        renderQuestion(true);
      });
    }

    function renderQuestion(isFirst) {
      const item = QUESTIONS[qIndex];
      const pct = ((qIndex + 1) / TOTAL) * 100;
      barFill.style.width = pct + '%';
      countLabel.textContent = `${qIndex + 1} / ${TOTAL}`;

      footer.innerHTML = `<p class="disclaimer">點選自動下一題 · ${qIndex + 1}/${TOTAL}</p>`;

      const showSection =
        qIndex === 0 || QUESTIONS[qIndex - 1].sectionId !== item.sectionId;

      const prev = stage.querySelector('.quiz-slide.is-active');
      if (prev && !isFirst) {
        prev.classList.remove('is-active');
        prev.classList.add('is-exit');
        setTimeout(() => prev.remove(), 380);
      }

      const slide = document.createElement('section');
      slide.className = 'quiz-slide is-active';
      slide.innerHTML = `
        <div class="q-center">
          ${showSection ? `
            <p class="q-section is-new">${item.sectionLabel}</p>
            <p class="q-section-hint">${item.sectionHint}</p>
          ` : ''}
          <p class="q-index">${String(qIndex + 1).padStart(2, '0')} / ${String(TOTAL).padStart(2, '0')}</p>
          <h2 class="q-text">${item.q}</h2>
          <ul class="q-options">
            ${item.opts.map((opt, i) => `
              <li class="q-opt is-stagger" style="animation-delay:${0.05 + i * 0.05}s">
                <button type="button" data-i="${i}">
                  ${opt}
                  <span class="dot"></span>
                </button>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
      stage.appendChild(slide);

      slide.querySelectorAll('.q-opt button').forEach(btn => {
        btn.addEventListener('click', () => pickAnswer(btn));
      });
    }

    function pickAnswer(btn) {
      if (btn.classList.contains('is-picked')) return;
      answers.push(parseInt(btn.dataset.i, 10));
      btn.classList.add('is-picked');
      btn.closest('.quiz-slide').querySelectorAll('button').forEach(b => {
        b.style.pointerEvents = 'none';
      });

      setTimeout(() => {
        if (qIndex < TOTAL - 1) {
          qIndex += 1;
          renderQuestion(false);
        } else {
          finishQuiz();
        }
      }, 280);
    }

    function finishQuiz() {
      barFill.style.width = '100%';
      countLabel.textContent = '完成';
      footer.innerHTML = '';
      const active = stage.querySelector('.quiz-slide.is-active');
      if (active) {
        active.classList.remove('is-active');
        active.classList.add('is-exit');
        setTimeout(() => active.remove(), 380);
      }
      analyze.classList.add('is-visible');

      const steps = [
        '讀取能量 & 社交…',
        '分析玩風 & 學習…',
        '對齊情緒 & 依戀…',
        '分配星群 · 生成狗格…',
      ];
      const stepEl = document.getElementById('analyzeSteps');
      let si = 0;
      stepEl.textContent = steps[0];
      const stepTimer = setInterval(() => {
        si += 1;
        if (si < steps.length) stepEl.textContent = steps[si];
        else clearInterval(stepTimer);
      }, 420);

      setTimeout(() => {
        clearInterval(stepTimer);
        const scored = window.PetSoulMatch.scoreQuizAnswers(answers);
        window.PetSoulProfile.save(scored);
        window.PetSoulProfile.markQuizDone();
        window.location.href = 'result.html?from=quiz';
      }, 2000);
    }

    renderIntro();
  </script>
</body>
</html>
