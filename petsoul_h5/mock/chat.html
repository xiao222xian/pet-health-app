<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pet Soul · 聊天</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/chat.css">
  <style>
    .chat-top {
      padding: calc(10px + var(--safe-top)) 12px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .chat-back {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      text-decoration: none;
    }

    .chat-peer {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .chat-peer img {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      object-fit: cover;
    }

    .chat-peer-name {
      font-size: 15px;
      font-weight: 500;
    }

    .chat-peer-meta {
      font-size: 11px;
      color: var(--ink-3);
      margin-top: 1px;
    }

    .chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.45;
    }

    .bubble.them {
      align-self: flex-start;
      background: var(--bg-2);
      color: var(--ink-2);
    }

    .bubble.me {
      align-self: flex-end;
      background: var(--ink);
      color: var(--bg);
    }

    .bubble-time {
      font-size: 10px;
      color: var(--ink-4);
      margin-top: 4px;
    }

    .bubble.me .bubble-time { color: rgba(255,255,255,0.55); }

    .chat-compose {
      padding: 10px 16px calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }

    .template-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      overflow-x: auto;
    }

    .template-row::-webkit-scrollbar { display: none; }

    .template-chip {
      flex-shrink: 0;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--bg);
      font-family: inherit;
      font-size: 12px;
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
    }

    .template-chip.primary {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .template-hint {
      font-size: 10px;
      color: var(--ink-4);
      margin: -4px 0 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 14px;
    }

    .send-btn {
      height: 40px;
      padding: 0 16px;
      border: none;
      border-radius: var(--radius);
      background: var(--ink);
      color: var(--bg);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .agent-preview {
      display: none;
      margin-bottom: 10px;
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--bg-2);
    }

    .agent-preview.is-open {
      display: block;
    }

    .agent-preview-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 8px;
    }

    .agent-preview-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      white-space: pre-wrap;
    }

    .agent-preview-note {
      font-size: 10px;
      color: var(--ink-4);
      margin-top: 8px;
    }

    .agent-preview-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .agent-preview-actions button {
      flex: 1;
      height: 36px;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .agent-preview-actions .agent-send {
      border: none;
      background: var(--ink);
      color: var(--bg);
    }

    .agent-preview-actions .agent-edit,
    .agent-preview-actions .agent-cancel {
      border: 1px solid var(--line-strong);
      background: var(--bg);
      color: var(--ink-2);
    }

    .chat-session-badge {
      font-size: 10px;
      color: var(--ink-3);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="chat-top">
      <a class="chat-back" href="matches.html" aria-label="返回">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <div class="chat-peer" id="chatPeer"></div>
    </header>

    <main class="chat-thread" id="thread"></main>

    <footer class="chat-compose">
      <p class="template-hint">寵物 Agent · 發送前需主人確認 · 臨時會話不加微信</p>
      <div class="template-row" id="templateRow">
        <button type="button" class="template-chip primary" data-template="playdate">🐾 約遛狗</button>
        <button type="button" class="template-chip" data-template="date">☕ 約見面</button>
      </div>
      <div class="agent-preview" id="agentPreview">
        <p class="agent-preview-label" id="agentPreviewLabel">寵物 Agent 建議</p>
        <p class="agent-preview-text" id="agentPreviewText"></p>
        <div class="agent-preview-actions">
          <button type="button" class="agent-send" id="agentConfirm">確認發送</button>
          <button type="button" class="agent-edit" id="agentEdit">改一句</button>
          <button type="button" class="agent-cancel" id="agentCancel">不用了</button>
        </div>
        <p class="agent-preview-note">所有真實消息發送前需主人確認</p>
      </div>
      <div class="input-row">
        <input type="text" class="chat-input" id="input" placeholder="輸入後點發送，先預覽再確認…" autocomplete="off">
        <button type="button" class="send-btn" id="sendBtn">預覽</button>
      </div>
    </footer>
  </div>

  <script src="js/match-engine.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/matches-data.js"></script>
  <script src="js/ms-config.js"></script>
  <script src="js/ms-api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const matchId = params.get('match') || 'bella';
    const isNew = params.get('new') === '1';
    const raw = window.PETSOUL_MATCHES[matchId] || window.PETSOUL_MATCHES.bella;
    const match = window.PETSOUL_rescoreMatch(raw);
    const templates = window.PETSOUL_TEMPLATES;
    const mine = window.PetSoulProfile.load() || {};
    const myPetName = mine.petName || '豆包';

    document.title = `Pet Soul · ${match.name}`;
    document.getElementById('chatPeer').innerHTML = `
      <img src="${match.img}" alt="">
      <div>
        <p class="chat-peer-name">${match.name} · ${match.owner}</p>
        <p class="chat-session-badge">臨時會話 · 同場 · 不加微信</p>
        <p class="chat-peer-meta">${match.distance} · 合频 ${match.score}% · ${match.intent}</p>
      </div>
    `;

    const thread = document.getElementById('thread');
    const agentPreview = document.getElementById('agentPreview');
    const agentPreviewText = document.getElementById('agentPreviewText');
    const agentPreviewLabel = document.getElementById('agentPreviewLabel');
    let playdateAccepted = false;
    let pendingAction = null;

    function nowTime() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function showAgentPreview(text, label, onConfirm) {
      agentPreviewText.textContent = text;
      agentPreviewLabel.textContent = label || `🐾 ${myPetName} Agent 建議`;
      pendingAction = onConfirm || { type: 'text', text };
      agentPreview.classList.add('is-open');
    }

    function hideAgentPreview() {
      agentPreview.classList.remove('is-open');
      pendingAction = null;
    }

    function confirmPendingAction() {
      if (!pendingAction) return;
      if (pendingAction.type === 'text') {
        appendBubble({ from: 'me', text: pendingAction.text, time: nowTime() });
        document.getElementById('input').value = '';
      } else if (pendingAction.type === 'event') {
        appendEventCard(pendingAction.tpl, true);
        runEventDemo(pendingAction.tpl);
      }
      hideAgentPreview();
    }

    function appendSoulBanner(score) {
      const el = document.createElement('div');
      el.className = 'soul-banner';
      el.innerHTML = `
        <p class="soul-banner-title">緣分羅盤 · 合頻成功</p>
        <p class="soul-banner-sub">合频 ${score}% · 雙向 ♥ · 臨時會話</p>
      `;
      thread.appendChild(el);
    }

    function appendBubble(msg) {
      if (msg.kind === 'soul-banner') {
        appendSoulBanner(msg.score);
        return;
      }
      const wrap = document.createElement('div');
      wrap.className = `bubble ${msg.from}`;
      wrap.innerHTML = `${msg.text}<p class="bubble-time">${msg.time || nowTime()}</p>`;
      thread.appendChild(wrap);
      thread.scrollTop = thread.scrollHeight;
    }

    function appendEventCard(tpl, fromMe) {
      const el = document.createElement('div');
      el.className = `event-card ${fromMe ? '' : 'them-card'}`;
      el.innerHTML = `
        <p class="event-brand">${tpl.brand}</p>
        <p class="event-title">${tpl.title}</p>
        <p class="event-row">${tpl.when}</p>
        <p class="event-row">${tpl.where}</p>
        <p class="event-note">${tpl.note}</p>
        ${fromMe ? `
          <div class="event-actions">
            <button type="button" class="alt" disabled style="opacity:0.6;cursor:default">等待回覆</button>
          </div>
        ` : `
          <div class="event-actions">
            <button type="button" class="accept" data-accept="${tpl.type}">接受</button>
            <button type="button" class="alt" data-decline>改時間</button>
          </div>
        `}
      `;
      thread.appendChild(el);
      el.querySelector('[data-accept]')?.addEventListener('click', (e) => {
        const type = e.target.dataset.accept;
        if (fromMe) return;
        showConfirmed(type);
      });
      thread.scrollTop = thread.scrollHeight;
    }

    function showConfirmed(type) {
      if (playdateAccepted) return;
      playdateAccepted = true;
      const c = window.PETSOUL_PLAYDATE_CONFIRMED;
      const el = document.createElement('div');
      el.className = 'confirmed-card';
      el.innerHTML = `
        <p class="check">✓</p>
        <p style="font-size:14px;font-weight:500">${type === 'playdate' ? 'Playdate 已確認' : '見面已確認'}</p>
        <p style="font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.45">${c.when}<br>${c.where}<br>${c.with}</p>
      `;
      thread.appendChild(el);
      setTimeout(() => {
        appendBubble({ from: 'them', text: type === 'playdate' ? '好呀！Bella 超愛海濱，明天见～' : '周六见！我会带 Lucky 🐕', time: nowTime() });
      }, 400);
      thread.scrollTop = thread.scrollHeight;
    }

    const seed = window.PETSOUL_CHAT_SEED[matchId] || [];
    if (isNew) appendSoulBanner(match.score);
    seed.forEach(m => {
      if (m.kind === 'soul-banner' && isNew) return;
      appendBubble(m);
    });

    if (isNew) {
      setTimeout(() => {
        appendBubble({ from: 'them', text: `嗨！我是 ${match.owner}～同場 Match 成功，想约遛狗吗？`, time: nowTime() });
      }, 600);

      const iceFallback = mine.iceHint || `同場見到 ${match.name} 可以打声招呼～`;
      window.PetSoulMS.icebreaker({
        userPetName: mine.petName || '豆包',
        theirPetName: match.name,
        theirOwner: match.owner || '',
        playArea: mine.playArea || match.distance || '同場',
        userIce: mine.iceHint || '',
        theirIce: match.ice || '',
        fallback: iceFallback,
      }, iceFallback).then(({ text }) => {
        const row = document.getElementById('templateRow');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'template-chip';
        btn.dataset.aiIce = '1';
        btn.textContent = `💬 Agent 破冰`;
        btn.title = text;
        btn.addEventListener('click', () => {
          showAgentPreview(text, `🐾 ${myPetName} Agent · 破冰建議`);
        });
        row.appendChild(btn);
      });
    }

    function runEventDemo(tpl) {
      if (matchId === 'bella' && tpl.type === 'playdate') {
        setTimeout(() => {
          appendEventCard(tpl, false);
          const cards = thread.querySelectorAll('.event-card.them-card');
          const last = cards[cards.length - 1];
          last.querySelector('.accept').textContent = '接受';
        }, 1200);
      }
      if (tpl.type === 'date' && matchId === 'lucky') {
        setTimeout(() => {
          appendBubble({ from: 'them', text: '可以呀！我知道一家可以带狗的咖啡～', time: nowTime() });
        }, 900);
      }
    }

    document.querySelectorAll('[data-template]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tpl = { ...templates[btn.dataset.template] };
        const summary = `${tpl.title}\n${tpl.when}\n${tpl.where}`;
        showAgentPreview(
          summary,
          `🐾 ${myPetName} Agent · ${tpl.brand}`,
          { type: 'event', tpl }
        );
      });
    });

    document.getElementById('agentConfirm').addEventListener('click', confirmPendingAction);
    document.getElementById('agentEdit').addEventListener('click', () => {
      if (pendingAction?.type === 'text') {
        document.getElementById('input').value = pendingAction.text;
      } else if (pendingAction?.type === 'event') {
        document.getElementById('input').value = pendingAction.tpl.title;
      }
      hideAgentPreview();
      document.getElementById('input').focus();
    });
    document.getElementById('agentCancel').addEventListener('click', hideAgentPreview);

    document.getElementById('sendBtn').addEventListener('click', previewText);
    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') previewText();
    });

    function previewText() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      showAgentPreview(text, `🐾 ${myPetName} Agent · 待你確認`);
    }
  </script>
</body>
</html>
