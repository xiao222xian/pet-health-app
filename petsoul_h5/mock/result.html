<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pet Soul · AI 人設卡</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/persona-card.css">
  <style>
    .result {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
      overflow-y: auto;
    }

    .result-head {
      text-align: center;
      margin-bottom: 8px;
    }

    .result-page-title {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .result-sub {
      margin-top: 4px;
      font-size: 12px;
      color: var(--ink-3);
    }

    .result-scroll {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
    }

    .result-footer {
      width: 100%;
      max-width: 340px;
      margin: 20px auto 0;
      padding-top: 4px;
    }

    .result-footer .btn-ghost {
      width: 100%;
      margin-top: 10px;
    }

    .intent-picker-wrap {
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="result">
      <header class="result-head">
        <p class="eyebrow">Paws-onality · 緣分羅盤</p>
        <h1 class="result-page-title">✦ AI 人設卡 ✦</h1>
        <p class="result-sub" id="resultPoolHint">測驗完成 · 已生成 WingPet 檔案</p>
      </header>

      <div class="result-scroll">
        <article class="persona-card" id="personaCard">
          <div class="persona-card__top"></div>
          <div class="persona-avatar">
            <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc087?w=300&q=80" alt="" data-profile="petPhoto">
          </div>
          <div class="persona-card__body">
            <div class="persona-name-row">
              <h2 class="persona-name" data-profile="petName">豆包</h2>
              <span class="persona-code-badge" data-profile="personaCode">ENFP</span>
            </div>
            <p class="persona-meta" data-profile="personaMeta">柯基 · 社交小太陽 · 氹仔海濱 · 同場</p>

            <div class="persona-tags" id="personaTags" aria-label="性格标签"></div>

            <section class="persona-section">
              <p class="persona-section-label">性格小傳</p>
              <p class="persona-bio" id="resultDesc">由你与牠的相处方式映射 · 测验反映人宠 Soul，Discover 时会与对方的相处风格比对。</p>
            </section>

            <div class="persona-prefs">
              <div>
                <p class="pref-label">喜歡</p>
                <ul class="pref-list" id="personaLikes"></ul>
              </div>
              <div>
                <p class="pref-label">不喜歡</p>
                <ul class="pref-list" id="personaDislikes"></ul>
              </div>
            </div>

            <div class="persona-foot">
              <span><strong>WingPet</strong> 已入池 ✓</span>
              <span data-profile="playArea">氹仔海濱 · 同場</span>
            </div>

            <button type="button" class="persona-regen" id="regenBio">重新生成小傳</button>
          </div>
        </article>
      </div>

      <footer class="result-footer">
        <div class="intent-picker-wrap">
          <p class="eyebrow" style="margin-bottom:12px;text-align:center">Petch · 我的意图</p>
          <div class="intent-picker" id="intentPicker">
            <div class="intent-opt"><button type="button" data-intent="遛狗搭子" class="selected">遛狗搭子<span class="mark"></span></button></div>
            <div class="intent-opt"><button type="button" data-intent="都可">都可<span class="mark"></span></button></div>
            <div class="intent-opt"><button type="button" data-intent="交友向">交友向<span class="mark"></span></button></div>
          </div>
          <div id="lookingForBlock" style="display:none;margin-top:20px">
            <p class="eyebrow" style="margin-bottom:12px;text-align:center">交友向 · 想认识</p>
            <div class="intent-picker" id="lookingForPicker">
              <div class="intent-opt"><button type="button" data-looking="不限" class="selected">不限<span class="mark"></span></button></div>
              <div class="intent-opt"><button type="button" data-looking="同性家長">同性家長<span class="mark"></span></button></div>
              <div class="intent-opt"><button type="button" data-looking="異性家長">異性家長<span class="mark"></span></button></div>
            </div>
          </div>
        </div>
        <a href="discover.html" class="btn-primary" id="discoverBtn" style="text-decoration:none;display:flex;margin-top:20px">保存檔案 · 開始刷 WingPet</a>
        <a href="me.html" class="btn-ghost" style="text-decoration:none;display:flex">我的名片 & QR</a>
        <p class="disclaimer" style="margin-top:16px">娛樂向性格測試 · 非約會 · 非專業行為評估</p>
      </footer>
    </main>
  </div>
  <script src="js/profile.js"></script>
  <script src="js/ms-config.js"></script>
  <script src="js/ms-api.js"></script>
  <script>
    window.PetSoulProfile.applyToResult(document);

    function loadSoulReveal() {
      const el = document.getElementById('resultDesc');
      const p = window.PetSoulProfile.load() || {};
      const fallback = '由你与牠的相处方式映射 · 娱乐向 Soul，Discover 时与对方的相处风格比对。';
      el.textContent = fallback;
      return window.PetSoulMS.soulResult({
        petName: p.petName || '豆包',
        breed: p.breed || '柯基',
        personaCode: p.personaCode || 'ENFP',
        personaTitle: p.personaTitle || '社交小太陽',
        playArea: p.playArea || '同場',
      }, fallback).then(({ text, ai }) => {
        el.textContent = text;
        if (ai) el.dataset.ai = '1';
        window.PetSoulProfile.save({ soulBio: text });
      });
    }

    loadSoulReveal();
    document.getElementById('regenBio').addEventListener('click', () => {
      const btn = document.getElementById('regenBio');
      btn.textContent = '生成中…';
      btn.disabled = true;
      loadSoulReveal().finally(() => {
        btn.textContent = '重新生成小傳';
        btn.disabled = false;
      });
    });

    if (new URLSearchParams(location.search).get('from') === 'quiz') {
      requestAnimationFrame(() => {
        document.getElementById('personaCard').classList.add('is-enter');
      });
    }

    let intent = window.PetSoulProfile.getIntent();
    let lookingFor = window.PetSoulProfile.getLookingFor();

    function toggleLookingFor(intentVal) {
      document.getElementById('lookingForBlock').style.display =
        intentVal === '交友向' ? 'block' : 'none';
    }

    document.querySelectorAll('.intent-opt button').forEach(b => {
      b.classList.toggle('selected', b.dataset.intent === intent);
    });
    document.querySelectorAll('#lookingForPicker button').forEach(b => {
      b.classList.toggle('selected', b.dataset.looking === lookingFor);
    });
    toggleLookingFor(intent);

    document.getElementById('intentPicker').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-intent]');
      if (!btn) return;
      intent = btn.dataset.intent;
      document.querySelectorAll('#intentPicker button').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      toggleLookingFor(intent);
    });

    document.getElementById('lookingForPicker').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-looking]');
      if (!btn) return;
      lookingFor = btn.dataset.looking;
      document.querySelectorAll('#lookingForPicker button').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });

    document.getElementById('discoverBtn').addEventListener('click', (e) => {
      e.preventDefault();
      window.PetSoulProfile.setIntent(intent);
      if (intent === '交友向') window.PetSoulProfile.setLookingFor(lookingFor);
      location.href = 'discover.html';
    });
  </script>
</body>
</html>
