# Pet Soul H5 mock → gh-pages（与 Settings 里 Deploy from branch 兼容）
name: Deploy Pet Soul H5

on:
  push:
    branches: [main]
    paths:
      - 'petsoul_h5/mock/**'
      - '.github/workflows/petsoul-h5-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: petsoul-h5-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish mock to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: petsoul_h5/mock
          commit_message: 'deploy: Pet Soul H5 mock'
