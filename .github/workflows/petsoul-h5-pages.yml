# Pet Soul H5 mock → GitHub Pages（静态，免费，100+ 人够用）
name: Deploy Pet Soul H5

on:
  push:
    branches: [main]
    paths:
      - 'petsoul_h5/mock/**'
      - '.github/workflows/petsoul-h5-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: petsoul-h5-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload mock site
        uses: actions/upload-pages-artifact@v3
        with:
          path: petsoul_h5/mock

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
